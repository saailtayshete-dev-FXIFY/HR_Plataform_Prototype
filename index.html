<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="Cobalt HR – in-house HR system prototype with sample data">
<style>
/* base reset (standalone hosting) */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Cobalt HR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell — fixed left rail of grouped modules, slim top bar with role switcher, content canvas of panels on a cool grey ground. */
:root{
  --bg:#f3f6fa;           /* page ground, grey with a blue bias */
  --surface:#ffffff;      /* panels */
  --surface-2:#f7f9fc;    /* table heads, inset areas */
  --line:#dde4ee;         /* hairlines */
  --line-strong:#c6d1e0;
  --ink:#0f1d33;          /* primary text, deep navy */
  --ink-2:#44546d;        /* secondary text */
  --ink-3:#7a8aa3;        /* muted */
  --blue:#1f5fd6;         /* accent */
  --blue-ink:#ffffff;
  --blue-soft:#e8f0fd;
  --blue-soft-2:#d4e3fb;
  --navy:#0b2a5b;         /* rail */
  --navy-ink:#c9d6ec;
  --navy-hi:#ffffff;
  --navy-active:#16407f;
  --seq-1:#d4e3fb; --seq-2:#a9c7f5; --seq-3:#6f9ee8; --seq-4:#3a78dc; --seq-5:#1f5fd6; --seq-6:#123f94;
  --good:#1d7a4e; --good-soft:#e3f4ea;
  --warn:#a5650a; --warn-soft:#fcf1dd;
  --bad:#b42f3a;  --bad-soft:#fbe7e8;
  --shadow:0 1px 2px rgba(15,29,51,.06),0 4px 14px rgba(15,29,51,.05);
  --f-display:"Manrope",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px; --r-sm:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1322;--surface:#111d31;--surface-2:#0e192b;--line:#1f2f4a;--line-strong:#2c3f60;
  --ink:#e6edf8;--ink-2:#a8b7cf;--ink-3:#7487a6;--blue:#5b93f0;--blue-ink:#06122a;--blue-soft:#132a52;--blue-soft-2:#1a3768;
  --navy:#071021;--navy-ink:#93a6c6;--navy-hi:#ffffff;--navy-active:#16305e;
  --seq-1:#16305e;--seq-2:#1f4588;--seq-3:#2d5fb5;--seq-4:#4479da;--seq-5:#6d9cf0;--seq-6:#a7c5f7;
  --good:#5cc993;--good-soft:#0f2e22;--warn:#e7b24e;--warn-soft:#33260c;--bad:#f07c85;--bad-soft:#3a171b;
  --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1322;--surface:#111d31;--surface-2:#0e192b;--line:#1f2f4a;--line-strong:#2c3f60;
  --ink:#e6edf8;--ink-2:#a8b7cf;--ink-3:#7487a6;--blue:#5b93f0;--blue-ink:#06122a;--blue-soft:#132a52;--blue-soft-2:#1a3768;
  --navy:#071021;--navy-ink:#93a6c6;--navy-hi:#ffffff;--navy-active:#16305e;
  --seq-1:#16305e;--seq-2:#1f4588;--seq-3:#2d5fb5;--seq-4:#4479da;--seq-5:#6d9cf0;--seq-6:#a7c5f7;
  --good:#5cc993;--good-soft:#0f2e22;--warn:#e7b24e;--warn-soft:#33260c;--bad:#f07c85;--bad-soft:#3a171b;
  --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
/* dropdown lists: some systems draw them on white regardless of theme, so set both colours */
select option,select optgroup{background-color:var(--surface);color:var(--ink)}
a{color:var(--blue)}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* shell */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);height:100%}
.rail{background:var(--navy);color:var(--navy-ink);display:flex;flex-direction:column;min-height:0;padding-left:env(safe-area-inset-left,0px)}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;color:var(--navy-hi)}
.brand-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(140deg,#3d82f2,#1f5fd6 55%,#123f94);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:15px;color:#fff}
.brand b{font-family:var(--f-display);font-size:17px;letter-spacing:-.02em}
.brand small{display:block;font-size:11px;color:var(--navy-ink);font-weight:400}
.nav{overflow-y:auto;padding:4px 10px 18px;flex:1}
.nav-group{margin-top:14px}
.nav-label{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:#6f86ad;padding:0 10px 6px;font-weight:600}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;color:var(--navy-ink);text-decoration:none;font-size:13.5px}
.nav a:hover{background:rgba(255,255,255,.06);color:var(--navy-hi)}
.nav a.active{background:var(--navy-active);color:var(--navy-hi);font-weight:500}
.nav a svg{width:16px;height:16px;flex:none;opacity:.85}
.nav .count{margin-left:auto;background:#2a63c9;color:#fff;font-size:11px;border-radius:9px;padding:0 6px;font-family:var(--f-mono)}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;background:var(--surface);border-bottom:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px 22px;min-height:58px}
.menu-btn{display:none}
.search{flex:1;max-width:420px;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 12px 8px 34px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink-3)}
.search-results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);max-height:340px;overflow:auto;z-index:30}
.search-results button{display:flex;width:100%;gap:10px;align-items:center;padding:8px 12px;border:0;background:none;text-align:left;cursor:pointer}
.search-results button:hover{background:var(--blue-soft)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.role-switch{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:4px 6px 4px 10px;background:var(--surface-2)}
.role-switch label{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.role-switch select{border:0;background:transparent;font-weight:500;padding:3px}
.icon-btn{position:relative;width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.icon-btn svg{width:17px;height:17px}
.icon-btn .dot{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid var(--surface)}
.content{flex:1;overflow-y:auto;padding:24px max(16px,env(safe-area-inset-right,0px)) 48px 24px}
.page{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-head h1{font-size:24px;font-weight:700}
.page-head p{margin:4px 0 0;color:var(--ink-2);max-width:68ch}
.crumb{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:4px}
.crumb .fid{font-family:var(--f-mono);letter-spacing:0;color:var(--blue);background:var(--blue-soft);padding:1px 6px;border-radius:4px;margin-left:6px;text-transform:none}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-h h3{font-size:14.5px;font-weight:700}
.panel-h .sub{color:var(--ink-3);font-size:12.5px;font-weight:400;font-family:var(--f-body)}
.panel-b{padding:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g-1-2{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.stat{padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.stat .k{font-size:12px;color:var(--ink-2)}
.stat .v{font-family:var(--f-display);font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .d{font-size:12px;color:var(--ink-3)}
.stat .d.up{color:var(--good)} .stat .d.down{color:var(--bad)}

/* table */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;text-align:left;background:var(--surface-2);padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--blue-soft)}
td.r,th.r{text-align:right}

/* bits */
.person{display:flex;align-items:center;gap:10px;min-width:0}
.person .nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person .rl{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:600;font-family:var(--f-display);color:#fff}
.av.lg{width:64px;height:64px;font-size:22px}
.av.sm{width:24px;height:24px;font-size:10px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.plain::before{display:none}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.blue{background:var(--blue-soft);color:var(--blue);border-color:transparent}
.tag{font-size:11.5px;background:var(--blue-soft);color:var(--blue);padding:2px 8px;border-radius:5px;white-space:nowrap}
.muted{color:var(--ink-3)} .sec{color:var(--ink-2)}
.small{font-size:12.5px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:500;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.primary{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}
.btn.primary:hover{filter:brightness(1.08);color:var(--blue-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--blue-soft);color:var(--blue)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn.good{color:var(--good);border-color:var(--good)} .btn.bad{color:var(--bad);border-color:var(--bad)}
.btn svg{width:15px;height:15px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-weight:500}
.tabs button.on{color:var(--blue);border-bottom-color:var(--blue)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--ink-2)}
.input,select.input,textarea.input{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%}
textarea.input{min-height:84px;resize:vertical}
.input.sm{padding:5px 8px;width:auto}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid .full{grid-column:1/-1}
.bar{height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:99px}
.bar.good>i{background:var(--good)} .bar.warn>i{background:var(--warn)} .bar.bad>i{background:var(--bad)}
.empty{padding:30px;text-align:center;color:var(--ink-3)}
.list-item{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.list-item .grow{flex:1;min-width:0}
.check{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.check:last-child{border-bottom:0}
.check input{width:16px;height:16px;accent-color:var(--blue)}
.check.done span{text-decoration:line-through;color:var(--ink-3)}
.note{background:var(--blue-soft);border:1px solid var(--blue-soft-2);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:13px}
.kpi-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
.kpi-row .stat+.stat{border-left:1px solid var(--line)}

/* charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--ink-3);font-size:11px;font-family:var(--f-body)}
.chart .gridl{stroke:var(--line);stroke-width:1}
.chart .axis{stroke:var(--line-strong)}
.chart .hit{fill:transparent;cursor:pointer}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:6px;z-index:100;white-space:nowrap;box-shadow:var(--shadow)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.heat{display:grid;gap:3px}
.heat .c{border-radius:4px;height:30px;display:grid;place-items:center;font-size:11.5px;font-family:var(--f-mono)}

/* org chart */
.org{overflow-x:auto;padding:16px}
.org ul{list-style:none;margin:0;padding:18px 0 0;display:flex;justify-content:center;position:relative}
.org li{position:relative;padding:18px 6px 0;display:flex;flex-direction:column;align-items:center}
.org li::before,.org li::after{content:"";position:absolute;top:0;width:50%;height:18px;border-top:1px solid var(--line-strong)}
.org li::before{right:50%} .org li::after{left:50%;border-left:1px solid var(--line-strong)}
.org li:only-child::before,.org li:only-child::after{display:none}
.org li:only-child{padding-top:0}
.org li:first-child::before,.org li:last-child::after{border:0}
.org li:last-child::before{border-right:1px solid var(--line-strong);border-radius:0 6px 0 0}
.org li:first-child::after{border-radius:6px 0 0 0}
.org ul ul::before{content:"";position:absolute;top:0;left:50%;height:18px;border-left:1px solid var(--line-strong)}
.org>ul{padding-top:0}
.org-node{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:150px;display:flex;gap:8px;align-items:center;cursor:pointer;text-align:left}
.org-node:hover{border-color:var(--blue)}
.org-node.dept{background:var(--blue-soft);border-color:var(--blue-soft-2)}

/* modal / drawer / toast */
.overlay{position:fixed;inset:0;background:rgba(8,18,36,.45);z-index:80;display:flex;justify-content:flex-end}
.overlay.center{justify-content:center;align-items:center;padding:16px}
.drawer{background:var(--surface);width:min(560px,100%);height:100%;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* header, tab bar and footer keep their size; only the body scrolls */
.drawer>*{flex:none}
.drawer>.m-body{flex:1 1 auto;min-height:0;overflow-y:auto}
.drawer .tabs{scrollbar-width:none}
.drawer .tabs::-webkit-scrollbar{display:none}
.drawer .tabs button{padding:10px 11px}
.modal{background:var(--surface);width:min(560px,100%);max-height:90vh;overflow-y:auto;border-radius:12px;box-shadow:var(--shadow)}
.m-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line);gap:10px}
.m-head h3{font-size:16px}
.m-body{padding:18px;display:flex;flex-direction:column;gap:14px}
.m-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--line)}
.toasts{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:calc(16px + env(safe-area-inset-right,0px));z-index:120;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;box-shadow:var(--shadow);font-size:13px;max-width:340px}
.dl{display:grid;grid-template-columns:140px minmax(0,1fr);gap:8px 14px;font-size:13.5px}
.dl dt{color:var(--ink-3)} .dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
.mood{display:flex;gap:8px;flex-wrap:wrap}
.mood button{flex:1;min-width:64px;border:1px solid var(--line-strong);background:var(--surface);border-radius:9px;padding:10px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--ink-2)}
.mood button b{font-family:var(--f-display);font-size:18px;color:var(--ink)}
.mood button.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.scale{display:flex;gap:4px}
.scale button{width:34px;height:34px;border-radius:7px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-family:var(--f-mono)}
.scale button.on{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}
.feed-card{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px}
.feed-card:last-child{border-bottom:0}
.kanban{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.kcol{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.kcol h4{font-size:12.5px;display:flex;justify-content:space-between;color:var(--ink-2);padding:2px 4px}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.kcard:hover{border-color:var(--blue)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .h{font-size:11px;color:var(--ink-3);text-align:center;padding:4px 0;text-transform:uppercase;letter-spacing:.05em}
.cal .d{min-height:74px;border:1px solid var(--line);border-radius:7px;padding:5px;font-size:11.5px;display:flex;flex-direction:column;gap:3px;background:var(--surface);min-width:0;overflow:hidden}
.cal .d.off{background:var(--surface-2);color:var(--ink-3)}
.cal .d.today{border-color:var(--blue)}
.cal .d .n{font-family:var(--f-mono);color:var(--ink-3)}
.cal .ev{background:var(--blue-soft);color:var(--blue);border-radius:4px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .ev.hol{background:var(--warn-soft);color:var(--warn)}
.matrix td.lv{text-align:center;padding:6px}
.lvl{display:inline-grid;place-items:center;width:28px;height:24px;border-radius:5px;font-family:var(--f-mono);font-size:12px}
.mobile-nav{display:none}
.notif-panel{position:absolute;right:0;top:calc(100% + 8px);width:min(360px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:40;max-height:420px;overflow:auto}
.switch{position:relative;width:40px;height:22px;border-radius:99px;border:0;background:var(--line-strong);cursor:pointer;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.switch.on{background:var(--blue)} .switch.on::after{left:21px}
.integ{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.integ:last-child{border-bottom:0}
.integ .logo{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:#fff;flex:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi-row{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi-row .stat:nth-child(3){border-left:0}.kpi-row .stat:nth-child(n+3){border-top:1px solid var(--line)}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;inset:0 auto 0 0;width:270px;z-index:90;transform:translateX(-100%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px)}
  .app.nav-open .rail{transform:none}
  .app.nav-open::after{content:"";position:fixed;inset:0;background:rgba(8,18,36,.4);z-index:85}
  .menu-btn{display:grid}
  .g2,.g3,.g-2-1,.g-1-2{grid-template-columns:1fr}
  .content{padding:16px max(16px,env(safe-area-inset-right,0px)) calc(84px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .topbar{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .role-switch label{display:none}
  .mobile-nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));justify-content:space-around}
  .mobile-nav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--ink-3);text-decoration:none;padding:4px 8px;border-radius:7px}
  .mobile-nav a.active{color:var(--blue)}
  .mobile-nav svg{width:20px;height:20px}
  .search{max-width:none}
}
@media (max-width:600px){
  .g4,.kpi-row{grid-template-columns:1fr 1fr}
  .form-grid{grid-template-columns:1fr}
  .dl{grid-template-columns:1fr}
  .page-head h1{font-size:20px}
  .search{display:none}
  .cal .d{min-height:54px}
  .cal .ev{font-size:10px}
}
